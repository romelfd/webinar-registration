name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webinar_registration
          MYSQL_USER: webinar_app
          MYSQL_PASSWORD: testpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run schema migration against the test DB
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: webinar_app
          DB_PASSWORD: testpass
          DB_NAME: webinar_registration
        run: npm run migrate
      - name: Unit tests
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, validate only)
        working-directory: infra
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infra
        run: terraform validate
